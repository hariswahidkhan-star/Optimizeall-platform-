name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "22"

jobs:
  # ----------------------------------------------------------------------------------------------------
  backend:
    name: Backend (build + unit + integration, ${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The API runs on MySQL 8 or SQLite (Database:Provider); the whole integration suite runs on both.
        provider: [MySql, Sqlite]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=ci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/OptimizeAll.sln

      - name: Build
        run: dotnet build backend/OptimizeAll.sln -c Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test backend/tests/OptimizeAll.UnitTests -c Release --no-build
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Integration tests (${{ matrix.provider }})
        env:
          OPTIMIZEALL_TEST_PROVIDER: ${{ matrix.provider }}
          # MySQL: server-level connection; each test class creates and drops its own database.
          # SQLite: each test class uses its own temporary database file.
          OPTIMIZEALL_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User=root;Password=ci-root-password;"
        run: >-
          dotnet test backend/tests/OptimizeAll.IntegrationTests -c Release --no-build
          --logger "trx;LogFileName=integration-${{ matrix.provider }}.trx" --results-directory TestResults

      - name: Migrations are up to date (MySQL and SQLite)
        if: matrix.provider == 'Sqlite'
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.10
          scripts/regenerate-migrations.sh --check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ matrix.provider }}
          path: TestResults/*.trx
          if-no-files-found: warn

  # ----------------------------------------------------------------------------------------------------
  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: No source maps in the build (nginx serves dist/ publicly)
        run: |
          if find dist -name '*.map' | grep .; then
            echo "::error::The production build emitted source maps"; exit 1
          fi
          grep -qF 'location ~* \.map$' nginx/default.conf.template

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ----------------------------------------------------------------------------------------------------
  e2e:
    name: End-to-end (Playwright, Chromium)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=ci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build API
        run: dotnet build backend/src/OptimizeAll.Api -c Release

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Smoke suite (mocked API, vite preview on :4174)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4174
        run: |
          nohup npx vite preview --port 4174 --strictPort > "$RUNNER_TEMP/web-smoke.log" 2>&1 &
          web_pid=$!
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:4174/ > /dev/null 2>&1 && break
            sleep 2
          done
          set +e
          npm run e2e
          code=$?
          kill "$web_pid" 2>/dev/null
          exit $code

      # Same as scripts/e2e-journeys.sh locally: fresh database oa_e2e_<timestamp>, API on :5099 (Development,
      # Baseline seed only, file-mode email + dev mailbox, jobs off, bootstrap admin), `vite preview` on :4173
      # proxying to it, E2E_SUITE=journeys on the desktop and mobile projects, teardown and Playwright's exit code.
      - name: Full-stack journeys (scripts/e2e-journeys.sh)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: ci-root-password
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e
        run: scripts/e2e-journeys.sh

      # Agency platform journeys (public website, CRM → proposal → invoice, delivery/email/social approvals, landing
      # pages, authorization, phone layouts) against the Demo seed's accounts, on a throwaway SQLite database.
      - name: Agency journeys (scripts/e2e-journeys.sh, E2E_SUITE=agency, SQLite)
        env:
          E2E_SUITE: agency
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-agency
        run: scripts/e2e-journeys.sh

      # Newest platform features (test users and "log in as" with the non-production test sign-in, custom roles,
      # payments hub, editing across areas, Google sign-in off, phone layouts) against the Demo seed, on SQLite.
      - name: Platform journeys (scripts/e2e-journeys.sh, E2E_SUITE=platform, SQLite)
        env:
          E2E_SUITE: platform
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-platform
        run: scripts/e2e-journeys.sh

      # One complete client-delivery journey through the client portal (docs/CLIENT_DELIVERY.md): onboarding a new client,
      # a user per duty via the dev mailbox, project from a template and kanban, deliverable versions and approvals, time and
      # timesheets, messages, meetings, reports, briefs, feedback, dashboard numbers, and the negatives (tenancy, duties,
      # conflicts, double clicks, interrupted uploads, file limits, expired session). Demo seed, SQLite.
      - name: Client delivery journey (scripts/e2e-journeys.sh, E2E_SUITE=j-delivery, SQLite)
        env:
          E2E_SUITE: j-delivery
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-j-delivery
        run: scripts/e2e-journeys.sh

      # Lead to cash, one business journey end to end: public website forms, booking and newsletter → inquiry → CRM →
      # proposal → acceptance → client account → contract → recurring invoice → client payment report → paid, with its
      # spam/replay/permission/tenancy/concurrency negatives. Demo seed, SQLite.
      - name: Lead-to-cash journey (scripts/e2e-journeys.sh, E2E_SUITE=j-lead-to-cash, SQLite)
        env:
          E2E_SUITE: j-lead-to-cash
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-lead-to-cash
        run: scripts/e2e-journeys.sh

      # The platform-administration journey end to end (users, suspensions, built-in and custom roles with guardrails,
      # test accounts and "log in as", audit, settings, content, jobs, global search and negatives), Demo seed, SQLite.
      - name: Admin journey (scripts/e2e-journeys.sh, E2E_SUITE=j-admin, SQLite)
        env:
          E2E_SUITE: j-admin
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-j-admin
        run: scripts/e2e-journeys.sh

      # The academy and learning journey end to end (public academy, lessons, knowledge checks, exam fail/retake/pass,
      # certificate PDF, verification, LinkedIn links, admin revocation), Demo seed, SQLite.
      - name: Learning journey (scripts/e2e-journeys.sh, E2E_SUITE=j-learning, SQLite)
        env:
          E2E_SUITE: j-learning
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-j-learning
        run: scripts/e2e-journeys.sh

      # Accessibility & responsive audit (docs/ACCESSIBILITY.md): every portal's representative pages at 360/768/1280 px
      # with axe (WCAG 2.2 A/AA, light and dark contrast) and no horizontal scroll, plus keyboard/focus behaviour.
      - name: Accessibility audit (scripts/e2e-journeys.sh, E2E_SUITE=a11y, SQLite)
        env:
          E2E_SUITE: a11y
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-a11y
        run: scripts/e2e-journeys.sh

      # Every demo role walks every page of its portals (nav, sub-nav, tabs, first detail page, primary actions opened
      # and cancelled) and the public website's header/footer links and sitemap: no console errors, failed API calls,
      # error boundaries or pages without an h1. Read-only, on the Demo seed and SQLite.
      - name: Crawl every page per role (scripts/e2e-journeys.sh, E2E_SUITE=crawl, SQLite)
        env:
          E2E_SUITE: crawl
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-crawl
        run: scripts/e2e-journeys.sh

      # One participant's whole lifecycle: registration and email verification, profile, social profiles at the 90-day
      # boundary, campaign filters, submissions through correction/withdrawal/rejection/appeal/approval (with
      # duplicate, double-click and parallel-request checks), earnings, payout details and a paid payout, referral,
      # notifications and preferences, support, session refresh/expiry, password change, sign-out; plus a phone pass.
      # The staff side is driven through the API. Baseline seed, SQLite.
      - name: Participant lifecycle (scripts/e2e-journeys.sh, E2E_SUITE=j-participant, SQLite)
        env:
          E2E_SUITE: j-participant
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-j-participant
        run: scripts/e2e-journeys.sh

      # Campaign manager + reviewer journey: editor sections, assets, disclosures, versioned reward rules, preview,
      # publish/schedule, lifecycle, duplicate, invitation + landing page, A/B experiment, review queue races, live
      # checks, appeals, stats, analytics and the negatives (budget, caps, archived, 403s, 409s). Baseline + Demo, SQLite.
      - name: Campaign manager + reviewer journey (scripts/e2e-journeys.sh, E2E_SUITE=j-campaigns, SQLite)
        env:
          E2E_SUITE: j-campaigns
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-j-campaigns
        run: scripts/e2e-journeys.sh

      # Finance money journey (docs/PAYOUTS.md, docs/SALES_AND_BILLING.md#payments-hub): ledger, four-eyes adjustments,
      # FX, holds, schedule, a biweekly batch with carry-over and exclusions, segregation of duties, audited exports,
      # manual payments, failed → re-queued, reconciliation, the payments hub's incoming flows and the negative paths
      # (idempotency, stale stamps, overpayment, 403s, impersonation, expired session). Demo seed, SQLite.
      - name: Finance journey (scripts/e2e-journeys.sh, E2E_SUITE=j-finance, SQLite)
        env:
          E2E_SUITE: j-finance
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-j-finance
        run: scripts/e2e-journeys.sh

      # Site content, SEO and landing-page builder journey: CMS pages (revisions, schedules, reserved slugs), services and
      # pricing, case studies/testimonials/team, the blog workflow, site settings, head tags/JSON-LD/robots/sitemap,
      # landing pages and forms (publish, A/B, analytics, CSV export) and the permission negatives. Baseline + Demo, SQLite.
      - name: Site content + SEO + landing pages journey (scripts/e2e-journeys.sh, E2E_SUITE=j-content, SQLite)
        env:
          E2E_SUITE: j-content
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-j-content
        run: scripts/e2e-journeys.sh

      # Social media + paid ads journey: profiles and connections (manual/expired tokens, OAuth refusals), the content
      # calendar (compose, per-network limits, media, reschedule, delete), internal + client approvals, the publishing
      # job against a local Graph API stub (idempotent, retries, failures, manual publishing), post analytics, ad
      # accounts, CSV spend import, budgets and client-facing ad reports, plus permissions, tenancy, impersonation,
      # conflicts and double clicks. Baseline + Demo, SQLite.
      - name: Social + ads journey (scripts/e2e-journeys.sh, E2E_SUITE=j-social, SQLite)
        env:
          E2E_SUITE: j-social
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-j-social
        run: scripts/e2e-journeys.sh

      # Cross-cutting edge cases in a real browser: calendar dates with the browser at UTC+14, UTC-12 and UTC+05:45,
      # invoices in 0/2/3-decimal currencies (JPY, PKR, KWD), and 60 identical projects paged through the list plus
      # wildcard/quote/backslash/emoji search. Demo seed, SQLite.
      - name: Edge-case suite (scripts/e2e-journeys.sh, E2E_SUITE=j-edge, SQLite)
        env:
          E2E_SUITE: j-edge
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-j-edge
        run: scripts/e2e-journeys.sh

      # The agency's email-marketing journey in a brand-new client workspace: settings and a verified sender, lists,
      # manual contacts and CSV imports (malformed rows, duplicates, limits), suppression, templates and test sends,
      # campaigns from draft through schedule/send/pause/cancel (no double sends under concurrent job runs), open/click
      # tracking, signed provider webhooks, public unsubscribe/preferences/confirm pages, reports and permissions.
      # Demo seed, SQLite.
      - name: Email marketing journey (scripts/e2e-journeys.sh, E2E_SUITE=j-email, SQLite)
        env:
          E2E_SUITE: j-email
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-j-email
        run: scripts/e2e-journeys.sh

      # Authentication & security journey: registration, verification, lockout, password reset/change, sessions and
      # refresh-token rotation, cross-tab sign-out, open redirects, portal guards, impersonation, headers, IDOR/XSS and
      # rate limits. Demo seed, SQLite.
      - name: Authentication & security (scripts/e2e-journeys.sh, E2E_SUITE=j-auth, SQLite)
        env:
          E2E_SUITE: j-auth
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-j-auth
        run: scripts/e2e-journeys.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            ${{ runner.temp }}/e2e/api.log
            ${{ runner.temp }}/e2e/web.log
            ${{ runner.temp }}/e2e-agency/api.log
            ${{ runner.temp }}/e2e-agency/web.log
            ${{ runner.temp }}/e2e-platform/api.log
            ${{ runner.temp }}/e2e-platform/web.log
            ${{ runner.temp }}/e2e-j-delivery/api.log
            ${{ runner.temp }}/e2e-j-delivery/web.log
            ${{ runner.temp }}/e2e-j-admin/api.log
            ${{ runner.temp }}/e2e-j-admin/web.log
            ${{ runner.temp }}/e2e-j-learning/api.log
            ${{ runner.temp }}/e2e-j-learning/web.log
            ${{ runner.temp }}/e2e-a11y/api.log
            ${{ runner.temp }}/e2e-a11y/web.log
            ${{ runner.temp }}/e2e-crawl/api.log
            ${{ runner.temp }}/e2e-crawl/web.log
            ${{ runner.temp }}/e2e-j-participant/api.log
            ${{ runner.temp }}/e2e-j-participant/web.log
            ${{ runner.temp }}/e2e-j-campaigns/api.log
            ${{ runner.temp }}/e2e-j-campaigns/web.log
            ${{ runner.temp }}/e2e-j-finance/api.log
            ${{ runner.temp }}/e2e-j-finance/web.log
            ${{ runner.temp }}/e2e-j-edge/api.log
            ${{ runner.temp }}/e2e-j-edge/web.log
            ${{ runner.temp }}/e2e-lead-to-cash/api.log
            ${{ runner.temp }}/e2e-lead-to-cash/web.log
            ${{ runner.temp }}/e2e-j-content/api.log
            ${{ runner.temp }}/e2e-j-content/web.log
            ${{ runner.temp }}/e2e-j-social/api.log
            ${{ runner.temp }}/e2e-j-social/web.log
            ${{ runner.temp }}/e2e-j-email/api.log
            ${{ runner.temp }}/e2e-j-email/web.log
            ${{ runner.temp }}/e2e-j-auth/api.log
            ${{ runner.temp }}/e2e-j-auth/web.log
            ${{ runner.temp }}/web-smoke.log
          retention-days: 7
          if-no-files-found: ignore

  # ----------------------------------------------------------------------------------------------------
  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: false
          tags: optimizeall-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build migrator image (EF Core migrations bundle)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: migrator
          push: false
          tags: optimizeall-migrator:ci
          cache-from: type=gha,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: optimizeall-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Validate compose files
        run: |
          docker compose --env-file deploy/.env.staging.example -f deploy/docker-compose.staging.yml config --quiet
          docker compose --env-file deploy/.env.production.example -f deploy/docker-compose.production.example.yml config --quiet
