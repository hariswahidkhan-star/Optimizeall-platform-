name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "22"

jobs:
  # ----------------------------------------------------------------------------------------------------
  backend:
    name: Backend (build + unit + integration, ${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The API runs on MySQL 8 or SQLite (Database:Provider); the whole integration suite runs on both.
        provider: [MySql, Sqlite]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=ci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/OptimizeAll.sln

      - name: Build
        run: dotnet build backend/OptimizeAll.sln -c Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test backend/tests/OptimizeAll.UnitTests -c Release --no-build
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Integration tests (${{ matrix.provider }})
        env:
          OPTIMIZEALL_TEST_PROVIDER: ${{ matrix.provider }}
          # MySQL: server-level connection; each test class creates and drops its own database.
          # SQLite: each test class uses its own temporary database file.
          OPTIMIZEALL_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User=root;Password=ci-root-password;"
        run: >-
          dotnet test backend/tests/OptimizeAll.IntegrationTests -c Release --no-build
          --logger "trx;LogFileName=integration-${{ matrix.provider }}.trx" --results-directory TestResults

      - name: Migrations are up to date (MySQL and SQLite)
        if: matrix.provider == 'Sqlite'
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.10
          scripts/regenerate-migrations.sh --check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ matrix.provider }}
          path: TestResults/*.trx
          if-no-files-found: warn

  # ----------------------------------------------------------------------------------------------------
  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: No source maps in the build (nginx serves dist/ publicly)
        run: |
          if find dist -name '*.map' | grep .; then
            echo "::error::The production build emitted source maps"; exit 1
          fi
          grep -qF 'location ~* \.map$' nginx/default.conf.template

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ----------------------------------------------------------------------------------------------------
  e2e:
    name: End-to-end (Playwright, Chromium)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=ci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build API
        run: dotnet build backend/src/OptimizeAll.Api -c Release

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Smoke suite (mocked API, vite preview on :4174)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4174
        run: |
          nohup npx vite preview --port 4174 --strictPort > "$RUNNER_TEMP/web-smoke.log" 2>&1 &
          web_pid=$!
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:4174/ > /dev/null 2>&1 && break
            sleep 2
          done
          set +e
          npm run e2e
          code=$?
          kill "$web_pid" 2>/dev/null
          exit $code

      # Same as scripts/e2e-journeys.sh locally: fresh database oa_e2e_<timestamp>, API on :5099 (Development,
      # Baseline seed only, file-mode email + dev mailbox, jobs off, bootstrap admin), `vite preview` on :4173
      # proxying to it, E2E_SUITE=journeys on the desktop and mobile projects, teardown and Playwright's exit code.
      - name: Full-stack journeys (scripts/e2e-journeys.sh)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: ci-root-password
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e
        run: scripts/e2e-journeys.sh

      # Agency platform journeys (public website, CRM → proposal → invoice, delivery/email/social approvals, landing
      # pages, authorization, phone layouts) against the Demo seed's accounts, on a throwaway SQLite database.
      - name: Agency journeys (scripts/e2e-journeys.sh, E2E_SUITE=agency, SQLite)
        env:
          E2E_SUITE: agency
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-agency
        run: scripts/e2e-journeys.sh

      # Newest platform features (test users and "log in as" with the non-production test sign-in, custom roles,
      # payments hub, editing across areas, Google sign-in off, phone layouts) against the Demo seed, on SQLite.
      - name: Platform journeys (scripts/e2e-journeys.sh, E2E_SUITE=platform, SQLite)
        env:
          E2E_SUITE: platform
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-platform
        run: scripts/e2e-journeys.sh

      # Accessibility & responsive audit (docs/ACCESSIBILITY.md): every portal's representative pages at 360/768/1280 px
      # with axe (WCAG 2.2 A/AA, light and dark contrast) and no horizontal scroll, plus keyboard/focus behaviour.
      - name: Accessibility audit (scripts/e2e-journeys.sh, E2E_SUITE=a11y, SQLite)
        env:
          E2E_SUITE: a11y
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-a11y
        run: scripts/e2e-journeys.sh

      # Every demo role walks every page of its portals (nav, sub-nav, tabs, first detail page, primary actions opened
      # and cancelled) and the public website's header/footer links and sitemap: no console errors, failed API calls,
      # error boundaries or pages without an h1. Read-only, on the Demo seed and SQLite.
      - name: Crawl every page per role (scripts/e2e-journeys.sh, E2E_SUITE=crawl, SQLite)
        env:
          E2E_SUITE: crawl
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-crawl
        run: scripts/e2e-journeys.sh

      # Campaign manager + reviewer journey: editor sections, assets, disclosures, versioned reward rules, preview,
      # publish/schedule, lifecycle, duplicate, invitation + landing page, A/B experiment, review queue races, live
      # checks, appeals, stats, analytics and the negatives (budget, caps, archived, 403s, 409s). Baseline + Demo, SQLite.
      - name: Campaign manager + reviewer journey (scripts/e2e-journeys.sh, E2E_SUITE=j-campaigns, SQLite)
        env:
          E2E_SUITE: j-campaigns
          E2E_DB_PROVIDER: sqlite
          E2E_SKIP_BUILD: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/e2e-j-campaigns
        run: scripts/e2e-journeys.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            ${{ runner.temp }}/e2e/api.log
            ${{ runner.temp }}/e2e/web.log
            ${{ runner.temp }}/e2e-agency/api.log
            ${{ runner.temp }}/e2e-agency/web.log
            ${{ runner.temp }}/e2e-platform/api.log
            ${{ runner.temp }}/e2e-platform/web.log
            ${{ runner.temp }}/e2e-a11y/api.log
            ${{ runner.temp }}/e2e-a11y/web.log
            ${{ runner.temp }}/e2e-crawl/api.log
            ${{ runner.temp }}/e2e-crawl/web.log
            ${{ runner.temp }}/e2e-j-campaigns/api.log
            ${{ runner.temp }}/e2e-j-campaigns/web.log
            ${{ runner.temp }}/web-smoke.log
          retention-days: 7
          if-no-files-found: ignore

  # ----------------------------------------------------------------------------------------------------
  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: false
          tags: optimizeall-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build migrator image (EF Core migrations bundle)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: migrator
          push: false
          tags: optimizeall-migrator:ci
          cache-from: type=gha,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: optimizeall-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Validate compose files
        run: |
          docker compose --env-file deploy/.env.staging.example -f deploy/docker-compose.staging.yml config --quiet
          docker compose --env-file deploy/.env.production.example -f deploy/docker-compose.production.example.yml config --quiet
