# Error answers of the API-generated text files (robots.txt, sitemaps, llms.txt, *.md, key files), included in their
# locations after proxy-api.conf. These URLs are opened directly in browsers and by crawlers, so an error must never be
# the API's application/problem+json (or nginx's HTML 502): browsers offer JSON on a top-level navigation as a download
# (e.g. a new web in front of an older API that doesn't know the route yet). Successful answers pass through unchanged,
# with their own content type; any error status becomes a short text/plain body. Without "=" the status is kept (404
# stays 404, 429 stays 429); an unreachable API (502/504) becomes 503 + Retry-After.
proxy_intercept_errors on;
error_page 404 410 @text_missing;
error_page 400 401 403 405 408 413 429 500 501 503 @text_error;
error_page 502 504 =503 @text_error;
