# Shared reverse-proxy settings for API locations. The API enables ForwardedHeaders (X-Forwarded-For,
# X-Forwarded-Proto) and uses the resulting client IP for rate limiting and hashed fraud signals, and the
# scheme for HSTS/secure redirects. nginx appends the connecting peer to X-Forwarded-For; the API takes the
# right-most entry, i.e. the address nginx saw. If another load balancer sits in front of nginx, configure
# `set_real_ip_from <lb-cidr>; real_ip_header X-Forwarded-For;` so $remote_addr is the real client.
proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $oa_forwarded_proto;
proxy_redirect   off;
proxy_connect_timeout 5s;
# proxy_read_timeout stays at nginx's 60s default unless a location overrides it (setting it here as well
# would be a duplicate directive).
# The API sets its own security and cache headers (Cache-Control: no-store on /api); pass them through unchanged.
