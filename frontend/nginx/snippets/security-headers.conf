# Security headers for the SPA (included in every static location because add_header in a location
# replaces, rather than extends, headers inherited from the server block).
#
# CSP: everything same-origin. The API is reverse-proxied on the same origin, so connect-src 'self' covers it.
#   img-src data:/blob: allow inline icons and local previews of screenshots before upload.
#   style-src 'unsafe-inline' is needed for style attributes set by UI/chart libraries (no inline scripts allowed).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS: enable ONLY when the site is served exclusively over HTTPS (TLS at this nginx or at a load balancer in
# front of it). Once browsers see it they refuse plain http for max-age seconds. Start with a short max-age,
# then raise to 1 year (and consider `preload`) once confirmed.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
