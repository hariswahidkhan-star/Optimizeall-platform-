# Render Blueprint: Optimize All staging/demo environment on SQLite (the cheapest setup).
#
# Deploy: Render dashboard → New → Blueprint → connect this GitHub repository. See docs/RENDER.md.
#
#   optimizeall-web    public web service  — nginx serving the React app, reverse-proxying /api, /t and /health
#   optimizeall-api    private service     — ASP.NET Core API with its SQLite database and uploads on one disk
#                                            (applies migrations + seeds demo data on startup)
#
# Only optimizeall-web is reachable from the internet; it talks to the API over Render's private network.
#
# SQLite means exactly ONE API instance (never scale optimizeall-api beyond 1 or enable autoscaling: the database is
# a file on the service's disk, and named locks are in-process). Back up the database file (see docs/RENDER.md).
# For a multi-instance setup use the MySQL Blueprint: deploy/render/render-mysql.yaml.
#
# This is a demo/staging configuration: it seeds demo accounts and writes email to files (readable via the dev
# mailbox) instead of sending real email. Do not use it as-is for production (see docs/DEPLOYMENT.md).

services:
  - type: pserv
    name: optimizeall-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: starter
    numInstances: 1
    # No healthCheckPath here: Render documents HTTP health checks (healthCheckPath) for web services, and it is not
    # established that private services (pserv) support them, so none is configured rather than guessed. The API serves
    # /health/live and /health/ready; optimizeall-web proxies /health/ and has its own health check. The first start takes
    # about 75 s on starter (migrations + Baseline/Demo seed); meanwhile the port is open, /health/live answers 200 and
    # everything else 503 "starting" (docs/RENDER.md).
    # One disk for all state: db/optimizeall.db (+ -wal/-shm) and files/ (uploaded screenshots, campaign images).
    # Render keeps daily snapshots of disks; a disk also means zero-downtime deploys are not possible (the old
    # instance stops before the new one starts), which SQLite requires anyway.
    disk:
      name: api-storage
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: Database__Provider
        value: Sqlite
      - key: Database__SqlitePath
        value: /app/storage/db/optimizeall.db
      - key: Database__InitializationMode
        value: Migrate
      - key: Database__Seed__0
        value: Baseline
      - key: Database__Seed__1
        value: Demo
      # Demo/staging only: a database from an earlier release is upgraded keeping its data (as with Auto); if that
      # upgrade fails verification, or the file is unreadable, the old file is set aside unchanged in
      # db/backups/optimizeall-<old baseline>-<utc>-unmigrated.db and the API starts on a fresh demo database instead
      # of not starting at all (docs/DATABASE.md § Baseline upgrade). Production keeps the default, Auto.
      - key: Database__BaselineUpgrade
        value: AutoOrFresh
      # Memory (starter: 512 MB): workstation GC and a 300 MiB managed-heap cap, so the GC collects well before the
      # instance limit even if the runtime cannot see it. A full demo seed peaks at ~155 MiB of managed heap and
      # ~260 MiB resident (docs/RENDER.md, "Things to know").
      - key: DOTNET_gcServer
        value: "0"
      - key: DOTNET_GCHeapHardLimit
        value: "0x12C00000"
      - key: Jwt__SigningKey
        generateValue: true
      - key: Security__HashSalt
        generateValue: true
      - key: Security__SecureCookies
        value: "true"
      # Only nginx on Render's private network may set X-Forwarded-For/Proto/Host.
      - key: Hosting__TrustedNetworks__0
        value: 10.0.0.0/8
      # Optional, recommended: public URL of optimizeall-web, e.g. https://optimizeall-web.onrender.com. Left empty, links
      # use the address visitors reach optimizeall-web on (forwarded by nginx) and jobs/emails the last one seen
      # (docs/RENDER.md#public-url). Site settings -> SEO -> Site URL takes precedence over it.
      - key: Email__AppBaseUrl
        sync: false
      # Optional "Sign in with Google" (docs/RENDER.md): OAuth client from Google Cloud with the authorized redirect URI
      # https://<web-url>/auth/google/callback. Leave both empty to keep Google sign-in off (the button stays hidden).
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      # Demo email: written to files and readable at /api/v1/dev/mailbox?to=<email>. Switch to Smtp for real email.
      - key: Email__Mode
        value: File
      - key: DevTools__MailboxEnabled
        value: "true"
      - key: Swagger__Enabled
        value: "true"
      - key: Payments__Provider
        value: manual

  - type: web
    name: optimizeall-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: singapore
    plan: starter
    # nginx's own health endpoint: pages (/) are rendered by the API, which may still be starting (docs/SEO_CRO.md).
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: API_HOSTPORT
        fromService:
          type: pserv
          name: optimizeall-api
          property: hostport
      # Render's load balancer reaches the service from its private network; trust its X-Forwarded-For.
      - key: REAL_IP_FROM
        value: 10.0.0.0/8
