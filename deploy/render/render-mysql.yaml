# Render Blueprint: Optimize All staging/demo environment on MySQL 8 (multi-instance capable).
#
# The default Blueprint (render.yaml at the repo root) is the cheaper SQLite variant. To use this one instead:
# Render dashboard → New → Blueprint → connect this GitHub repository → set "Blueprint Path" to
# deploy/render/render-mysql.yaml. Paths below are relative to the repository root. See docs/RENDER.md.
#
#   optimizeall-web    public web service  — nginx serving the React app, reverse-proxying /api, /t and /health
#   optimizeall-api    private service     — ASP.NET Core API (applies migrations + seeds demo data on startup)
#   optimizeall-mysql  private service     — MySQL 8 on a persistent disk
#
# Only optimizeall-web is reachable from the internet; the API and MySQL talk over Render's private network.
# This is a demo/staging configuration: it seeds demo accounts and writes email to files (readable via the
# dev mailbox) instead of sending real email. Do not use it as-is for production (see docs/DEPLOYMENT.md).

services:
  - type: pserv
    name: optimizeall-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.0
    region: singapore
    plan: starter
    # Data lives in a sub-directory of the disk: a freshly formatted disk contains lost+found, which MySQL
    # refuses to initialize over.
    dockerCommand: docker-entrypoint.sh mysqld --datadir=/var/lib/mysql-disk/data --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql-disk
      sizeGB: 5
    envVars:
      - key: MYSQL_DATABASE
        value: optimizeall
      - key: MYSQL_USER
        value: optimizeall
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: pserv
    name: optimizeall-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: starter
    # Uploaded screenshots and campaign images.
    disk:
      name: api-storage
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: Database__Host
        fromService:
          type: pserv
          name: optimizeall-mysql
          property: host
      - key: Database__Port
        value: "3306"
      - key: Database__Name
        value: optimizeall
      - key: Database__User
        value: optimizeall
      - key: Database__Password
        fromService:
          type: pserv
          name: optimizeall-mysql
          envVarKey: MYSQL_PASSWORD
      - key: Database__InitializationMode
        value: Migrate
      - key: Database__Seed__0
        value: Baseline
      - key: Database__Seed__1
        value: Demo
      - key: Jwt__SigningKey
        generateValue: true
      - key: Security__HashSalt
        generateValue: true
      - key: Security__SecureCookies
        value: "true"
      # Only nginx on Render's private network may set X-Forwarded-For/Proto.
      - key: Hosting__TrustedNetworks__0
        value: 10.0.0.0/8
      # Public URL of optimizeall-web (used in email links), e.g. https://optimizeall-web.onrender.com
      - key: Email__AppBaseUrl
        sync: false
      # Optional "Sign in with Google" (docs/RENDER.md): OAuth client from Google Cloud with the authorized redirect URI
      # https://<web-url>/auth/google/callback. Leave both empty to keep Google sign-in off (the button stays hidden).
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      # Demo email: written to files and readable at /api/v1/dev/mailbox?to=<email>. Switch to Smtp for real email.
      - key: Email__Mode
        value: File
      - key: DevTools__MailboxEnabled
        value: "true"
      - key: Swagger__Enabled
        value: "true"
      - key: Payments__Provider
        value: manual

  - type: web
    name: optimizeall-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: singapore
    plan: starter
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"
      - key: API_HOSTPORT
        fromService:
          type: pserv
          name: optimizeall-api
          property: hostport
      # Render's load balancer reaches the service from its private network; trust its X-Forwarded-For.
      - key: REAL_IP_FROM
        value: 10.0.0.0/8
